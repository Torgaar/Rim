<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEC | Sellwood Elite Club</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      :root {
        --gold: #d4af37;
        --dark-gold: #996515;
        --luxury-black: #0a0a0a;
        --bg-panel: #141414;
        --text-light: #f1f5f9;
        --text-dim: #94a3b8;
      }

      body {
        background-color: var(--luxury-black);
        color: var(--text-light);
        font-family: "Georgia", serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        overflow-x: hidden;
      }

      header {
        padding: 20px 40px;
        display: flex;
        align-items: center;
        border-bottom: 1px solid var(--dark-gold);
        background: linear-gradient(to bottom, #1a1a1a, #0a0a0a);
      }

      .logo-text {
        font-size: 2.5rem;
        color: var(--gold);
        font-weight: 900;
        margin-right: 20px;
        letter-spacing: -2px;
        text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
      }

      .club-name {
        font-size: 1.5rem;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--gold);
        font-weight: bold;
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
      }

      /* Tab Navigation */
      .tab-nav {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
      }

      .tab-btn {
        background: none;
        border: 1px solid var(--dark-gold);
        color: var(--gold);
        padding: 10px 30px;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-family: inherit;
        transition: all 0.3s;
      }

      .tab-btn.active {
        background: var(--gold);
        color: black;
      }

      /* Sponsor Banner */
      #sponsor-banner {
        height: 100px;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        position: relative;
        overflow: hidden;
      }

      .sponsor-slide {
        position: absolute;
        opacity: 0;
        transition:
          opacity 1s ease-in-out,
          transform 1s ease-in-out;
        transform: scale(0.95);
        display: flex;
        align-items: center;
        gap: 15px;
        text-decoration: none;
        color: var(--gold);
      }

      .sponsor-slide.active {
        opacity: 1;
        transform: scale(1);
      }

      .sponsor-img {
        height: 50px;
        object-fit: contain;
        filter: drop-shadow(0 0 5px var(--dark-gold));
      }

      .sponsor-name {
        font-size: 1.2rem;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      /* Main Content */
      main {
        max-width: 1000px;
        margin: 40px auto;
        padding: 0 20px;
      }

      .section-title {
        text-align: center;
        font-size: 2.5rem;
        margin-bottom: 40px;
        color: var(--gold);
        text-transform: uppercase;
        letter-spacing: 6px;
        position: relative;
      }

      .section-title::after {
        content: "";
        display: block;
        width: 100px;
        height: 2px;
        background: var(--gold);
        margin: 15px auto;
      }

      /* News Grid */
      #news-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 30px;
      }

      .news-card {
        background: var(--bg-panel);
        border: 1px solid var(--dark-gold);
        border-radius: 4px;
        overflow: hidden;
        transition:
          transform 0.3s,
          box-shadow 0.3s;
      }

      .news-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
      }

      .news-thumb {
        width: 100%;
        height: 200px;
        object-fit: cover;
        border-bottom: 1px solid var(--dark-gold);
      }

      .news-content {
        padding: 20px;
      }

      .news-category {
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--gold);
        letter-spacing: 2px;
        margin-bottom: 10px;
        display: block;
      }

      .news-title {
        font-size: 1.4rem;
        margin-bottom: 0;
        line-height: 1.3;
        color: var(--text-light);
        cursor: pointer;
      }

      /* --- Mobile Responsiveness --- */
      @media (max-width: 768px) {
        header {
          padding: 15px 20px;
          flex-direction: column;
          text-align: center;
        }

        .logo-text {
          font-size: 2rem;
          margin-right: 0;
          margin-bottom: 5px;
        }

        .club-name {
          font-size: 1.1rem;
          letter-spacing: 2px;
        }

        .tab-nav {
          flex-direction: column;
          gap: 10px;
          margin-top: 20px;
          padding: 0 20px;
        }

        .tab-btn {
          width: 100%;
          padding: 12px 20px;
          font-size: 0.9rem;
        }

        #sponsor-banner {
          height: 80px;
        }

        .sponsor-img {
          height: 40px;
        }

        .sponsor-name {
          font-size: 1rem;
        }

        main {
          margin: 30px auto;
          padding: 0 15px;
        }

        .section-title {
          font-size: 1.8rem;
          margin-bottom: 30px;
          letter-spacing: 4px;
        }

        #news-grid {
          grid-template-columns: 1fr;
          gap: 20px;
        }

        .news-thumb {
          height: 180px;
        }

        .news-title {
          font-size: 1.2rem;
        }

        .auth-card {
          padding: 30px 20px;
          max-width: 90vw;
        }

        .auth-card h2 {
          font-size: 1.5rem;
          margin-bottom: 20px;
        }

        .auth-input,
        .auth-btn {
          padding: 10px;
          font-size: 0.9rem;
        }

        #chat-section {
          margin: 40px auto;
          padding: 0 15px;
        }

        #chat-box {
          height: 300px;
          padding: 15px;
        }

        .chat-msg {
          padding-bottom: 8px;
        }

        .chat-user {
          font-size: 0.75rem;
        }

        .chat-text {
          font-size: 0.9rem;
        }

        #reader-modal {
          padding: 30px 15px;
        }

        .reader-content {
          padding: 25px;
          width: 100%;
        }

        .close-reader {
          font-size: 1.5rem;
          top: 15px;
          right: 15px;
        }

        .reader-body {
          font-size: 1rem;
        }

        .section-title::after {
          width: 60px;
        }
      }

      /* Auth Overlay & Popups */
      #auth-overlay,
      #popup-overlay {
        position: fixed;
        inset: 0;
        background: var(--luxury-black);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      #popup-overlay {
        background: rgba(0, 0, 0, 0.85);
        z-index: 2000;
        backdrop-filter: blur(5px);
      }

      .auth-card {
        width: 100%;
        max-width: 400px;
        background: var(--bg-panel);
        border: 1px solid var(--dark-gold);
        padding: 40px;
        text-align: center;
        box-shadow: 0 0 50px rgba(212, 175, 55, 0.1);
      }

      .auth-card h2 {
        color: var(--gold);
        text-transform: uppercase;
        letter-spacing: 3px;
        margin-bottom: 30px;
      }

      .auth-input {
        width: 100%;
        padding: 12px;
        background: #000;
        border: 1px solid #333;
        color: var(--text-light);
        margin-bottom: 20px;
        font-family: inherit;
        box-sizing: border-box;
      }

      .auth-input:focus {
        outline: none;
        border-color: var(--gold);
      }

      .auth-btn {
        width: 100%;
        padding: 12px;
        background: var(--gold);
        color: black;
        border: none;
        text-transform: uppercase;
        font-weight: bold;
        letter-spacing: 2px;
        cursor: pointer;
        transition: background 0.3s;
      }

      .auth-btn:hover {
        background: #e5c07b;
      }

      /* Chat Section */
      #chat-box {
        background: var(--bg-panel);
        border: 1px solid var(--dark-gold);
        height: 400px;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin-bottom: 20px;
        scroll-behavior: smooth;
      }

      .chat-msg {
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(212, 175, 55, 0.1);
      }

      .chat-user {
        color: var(--gold);
        font-weight: bold;
        font-size: 0.8rem;
        text-transform: uppercase;
        margin-bottom: 5px;
      }

      .chat-text {
        color: var(--text-light);
        font-size: 0.95rem;
        font-family: sans-serif;
      }

      /* Reader Modal */
      #reader-modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.95);
        z-index: 500;
        display: none;
        overflow-y: auto;
        padding: 60px 20px;
      }

      .reader-content {
        max-width: 800px;
        margin: 0 auto;
        background: var(--bg-panel);
        padding: 40px;
        border: 1px solid var(--dark-gold);
        position: relative;
      }

      .close-reader {
        position: absolute;
        top: 20px;
        right: 20px;
        color: var(--gold);
        font-size: 2rem;
        cursor: pointer;
        line-height: 1;
      }

      .reader-body {
        font-size: 1.1rem;
        line-height: 1.8;
        color: var(--text-light);
        font-family: sans-serif;
      }
    </style>
  </head>
  <body class="locked">
    <div id="popup-overlay" style="display: none">
      <div class="auth-card" style="border-color: var(--gold)">
        <h2 id="popup-title">Notice</h2>
        <p id="popup-message" style="margin-bottom: 30px"></p>
        <button class="auth-btn" onclick="closePopup()">Back</button>
      </div>
    </div>

    <div id="auth-overlay">
      <div class="auth-card" id="login-form">
        <div class="logo-text" style="margin-bottom: 10px; margin-right: 0">
          SEC
        </div>
        <h2>Member Access</h2>
        <input
          type="text"
          id="login-user"
          class="auth-input"
          placeholder="FIRST NAME"
        />
        <input
          type="password"
          id="login-pass"
          class="auth-input"
          placeholder="PASSWORD"
        />
        <button class="auth-btn" onclick="attemptLogin()">Enter</button>
        <p style="font-size: 0.7rem; margin-top: 20px">
          New member?
          <a href="#" onclick="showRegister()" style="color: var(--gold)"
            >Use Access Code</a
          >
        </p>
      </div>

      <div class="auth-card" id="register-form" style="display: none">
        <h2>Register</h2>
        <input
          type="text"
          id="reg-code"
          class="auth-input"
          placeholder="ACCESS CODE"
        />
        <input
          type="text"
          id="reg-user"
          class="auth-input"
          placeholder="FIRST NAME"
        />
        <input
          type="password"
          id="reg-pass"
          class="auth-input"
          placeholder="NEW PASSWORD"
        />
        <p
          style="
            font-size: 0.6rem;
            color: #666;
            text-align: left;
            margin-bottom: 10px;
          "
        >
          Min 8 characters, 1 uppercase, 1 number, 1 special character.
        </p>
        <button class="auth-btn" onclick="attemptRegister()">
          Create Account
        </button>
        <p style="font-size: 0.7rem; margin-top: 20px">
          <a href="#" onclick="showLogin()" style="color: var(--gold)"
            >Back to Login</a
          >
        </p>
      </div>
    </div>

    <header>
      <div class="logo-text">SEC</div>
      <div class="club-name">Sellwood Elite Club</div>
    </header>

    <nav class="tab-nav">
      <button
        class="tab-btn active"
        id="btn-journal"
        onclick="showTab('journal')"
      >
        Journal
      </button>
      <button class="tab-btn" id="btn-lounge" onclick="showTab('lounge')">
        Lounge
      </button>
    </nav>

    <section id="sponsor-banner">
      <!-- Sponsors will be injected here -->
    </section>

    <main id="journal-section">
      <h2 class="section-title">The Journal</h2>
      <div id="news-grid">
        <!-- News stories will be injected here -->
      </div>
    </main>

    <section
      id="chat-section"
      style="
        max-width: 1000px;
        margin: 60px auto;
        padding: 0 20px;
        display: none;
      "
    >
      <h2 class="section-title">The Lounge</h2>
      <div id="chat-box">
        <!-- Messages -->
      </div>
      <div style="display: flex; gap: 10px">
        <input
          type="text"
          id="chat-input"
          class="auth-input"
          style="margin-bottom: 0"
          placeholder="Write a message..."
          onkeydown="if (event.key === 'Enter') sendChatMessage();"
        />
        <button
          class="auth-btn"
          style="width: auto; padding: 0 30px"
          onclick="sendChatMessage()"
        >
          Send
        </button>
      </div>
    </section>

    <div id="reader-modal">
      <div class="reader-content">
        <span class="close-reader" onclick="closeReader()">&times;</span>
        <div id="reader-inner"></div>
      </div>
    </div>

    <script>
      // --- Supabase Configuration ---
      const SUPABASE_URL = "https://grjuutzpretmzhjetuzv.supabase.co";
      const SUPABASE_KEY = "sb_publishable_KP4z_wRFYyOI3KDXweq6Yw_e4HAHUxs";
      const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      // --- Sponsor Logic ---
      const sponsors = [
        {
          name: "Block Over It",
          img: "blockoverit.png",
          link: "https://torgaarlezin-boop.github.io/Block-Over-It",
        },
        { name: "R1m", img: "r1m.png", link: "#" },
      ];

      function initSponsors() {
        const banner = document.getElementById("sponsor-banner");
        sponsors.forEach((s, idx) => {
          const slide = document.createElement("a");
          slide.href = s.link;
          slide.className = `sponsor-slide ${idx === 0 ? "active" : ""}`;
          slide.innerHTML = `<img src="${s.img}" class="sponsor-img" alt="${s.name}"><span class="sponsor-name">${s.name}</span>`;
          banner.appendChild(slide);
        });

        let currentIdx = 0;
        setInterval(() => {
          const slides = document.querySelectorAll(".sponsor-slide");
          slides[currentIdx].classList.remove("active");
          currentIdx = (currentIdx + 1) % slides.length;
          slides[currentIdx].classList.add("active");
        }, 4000);
      }

      // --- Popup Logic ---
      function showPopup(title, msg) {
        document.getElementById("popup-title").innerText = title;
        document.getElementById("popup-message").innerText = msg;
        document.getElementById("popup-overlay").style.display = "flex";
      }
      function closePopup() {
        document.getElementById("popup-overlay").style.display = "none";
      }

      // --- Auth Logic ---
      let currentMemberName = "";

      function showRegister() {
        document.getElementById("login-form").style.display = "none";
        document.getElementById("register-form").style.display = "block";
      }

      function showLogin() {
        document.getElementById("login-form").style.display = "block";
        document.getElementById("register-form").style.display = "none";
      }

      async function attemptRegister() {
        const code = document.getElementById("reg-code").value.trim();
        const name = document.getElementById("reg-user").value.trim();
        const pass = document.getElementById("reg-pass").value;

        if (!code || !name || !pass) {
          showPopup(
            "Incomplete Form",
            "Please fill in all fields to join the club.",
          );
          return;
        }

        const strongRegex =
          /^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#\$%\^&\*])(?=.{8,})/;
        if (!strongRegex.test(pass)) {
          showPopup(
            "Security Requirement",
            "Password must be at least 8 characters and include uppercase, numbers, and special characters.",
          );
          return;
        }

        const { data: codeData, error: codeErr } = await _supabase
          .from("sec_access_codes")
          .select("*")
          .eq("code", code)
          .eq("username", name)
          .eq("is_used", false)
          .single();

        if (codeErr || !codeData) {
          if (codeErr && codeErr.code !== "PGRST116") {
            console.error("Supabase Error:", codeErr);
            showPopup(
              "Connection Error",
              "Could not verify code. Please try again.",
            );
          } else {
            showPopup(
              "Invalid Access",
              "The code is incorrect, already used, or does not match the provided First Name.",
            );
          }
          return;
        }

        await _supabase
          .from("sec_access_codes")
          .update({ is_used: true })
          .eq("id", codeData.id);
        const { error: userErr } = await _supabase
          .from("sec_users")
          .insert([{ username: name, password: pass }]);

        if (userErr) {
          if (userErr.code === "23505") {
            showPopup(
              "Account Exists",
              "This First Name is already registered. Please log in instead.",
            );
          } else {
            showPopup("Error", "Error creating account: " + userErr.message);
          }
          return;
        }

        showPopup("Welcome", "Registration successful. Please log in.");
        showLogin();
      }

      async function attemptLogin() {
        const name = document.getElementById("login-user").value.trim();
        const pass = document.getElementById("login-pass").value.trim();

        const { data, error } = await _supabase
          .from("sec_users")
          .select("*")
          .eq("username", name)
          .eq("password", pass)
          .single();

        if (error || !data) {
          showPopup("Access Denied", "Invalid credentials provided.");
          return;
        }

        currentMemberName = name;
        unlockPage();
      }

      function showTab(tab) {
        const journal = document.getElementById("journal-section");
        const lounge = document.getElementById("chat-section");
        const btnJ = document.getElementById("btn-journal");
        const btnL = document.getElementById("btn-lounge");

        if (tab === "journal") {
          journal.style.display = "block";
          lounge.style.display = "none";
          btnJ.classList.add("active");
          btnL.classList.remove("active");
        } else {
          journal.style.display = "none";
          fetchMessages(); // Refresh immediately on switch
          lounge.style.display = "block";
          btnJ.classList.remove("active");
          btnL.classList.add("active");
          // Scroll to bottom of chat when opening tab
          const chatBox = document.getElementById("chat-box");
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      }

      function unlockPage() {
        document.body.classList.remove("locked");
        document.getElementById("auth-overlay").style.display = "none";

        showTab("journal");

        initSponsors();
        fetchNews();
        fetchMessages();
        // Real-time chat listener
        _supabase
          .channel("sec_chat_room")
          .on(
            "postgres_changes",
            { event: "INSERT", schema: "public", table: "sec_chat" },
            (payload) => {
              renderMessage(payload.new);
            },
          )
          .subscribe();

        // Auto-refresh the Lounge every 5 seconds
        setInterval(fetchMessages, 5000);
      }

      // --- Chat Logic ---
      async function fetchMessages() {
        const { data } = await _supabase
          .from("sec_chat")
          .select("*")
          .order("created_at", { ascending: true })
          .limit(50);
        if (data) {
          document.getElementById("chat-box").innerHTML = "";
          data.forEach(renderMessage);
        }
      }

      function renderMessage(msg) {
        const chatBox = document.getElementById("chat-box");
        const div = document.createElement("div");
        div.className = "chat-msg";
        div.innerHTML = `<div class="chat-user">${msg.first_name}</div><div class="chat-text">${msg.message}</div>`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      async function sendChatMessage() {
        const input = document.getElementById("chat-input");
        const msg = input.value.trim();
        if (!msg) return;
        input.value = "";
        await _supabase
          .from("sec_chat")
          .insert([{ first_name: currentMemberName, message: msg }]);
      }

      // --- Reader Logic ---
      let newsCache = [];
      function closeReader() {
        document.getElementById("reader-modal").style.display = "none";
      }
      function openArticle(id) {
        const story = newsCache.find((s) => s.id === id);
        if (!story) return;
        document.getElementById("reader-inner").innerHTML = `
                <span class="news-category">${story.category || "General"}</span>
                <h1 class="section-title" style="text-align: left; font-size: 2rem; margin-bottom: 20px;">${story.title}</h1>
                ${story.thumbnail_url ? `<img src="${story.thumbnail_url}" style="width: 100%; max-height: 400px; object-fit: cover; margin-bottom: 30px; border: 1px solid var(--dark-gold);">` : ""}
                <div class="reader-body">${story.content.replace(/\n/g, "<br>")}</div>
                <div style="font-size:0.8rem; color:var(--gold); margin-top:30px; border-top: 1px solid rgba(212,175,55,0.2); padding-top:20px;">
                    BY ${story.author || "MEMBER"} • ${new Date(story.created_at).toLocaleDateString()}
                </div>
            `;
        document.getElementById("reader-modal").style.display = "block";
      }

      // --- Fetch News ---
      async function fetchNews() {
        const grid = document.getElementById("news-grid");
        const { data, error } = await _supabase
          .from("sec_news")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) {
          grid.innerHTML = `<div style="text-align:center; color:red; grid-column:1/-1;">Error loading the archives.</div>`;
          return;
        }

        if (!data || data.length === 0) {
          grid.innerHTML = `<div style="text-align:center; color:var(--text-dim); grid-column:1/-1;">No news stories found in the archives.</div>`;
          return;
        }

        newsCache = data;
        grid.innerHTML = data
          .map(
            (story) => `
                <article class="news-card" onclick="openArticle('${story.id}')">
                    ${story.thumbnail_url ? `<img src="${story.thumbnail_url}" class="news-thumb" alt="Thumbnail">` : ""}
                    <div class="news-content">
                        <span class="news-category">${story.category || "General"}</span>
                        <h3 class="news-title">${story.title}</h3>
                        <div style="font-size:0.7rem; color:var(--gold); margin-top:15px; border-top: 1px solid rgba(212,175,55,0.1); padding-top:10px;">
                            READ STORY &rarr;
                        </div>
                    </div>
                </article>
            `,
          )
          .join("");
      }
    </script>
  </body>
</html>
